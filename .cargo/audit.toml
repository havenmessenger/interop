# cargo-audit configuration - auto-read by `cargo audit` (it reads `.cargo/audit.toml` relative to cwd).
#
# Each advisory below was verified against the LIVE resolved build graph (`cargo tree -i`), not assumed.
# This crate (mimi-core) is pure MIMI/MLS provider logic + content codec - it contains NO cryptographic
# primitives of its own; the advisories here are transitive, via the openmls MLS stack.

[advisories]
ignore = [
    # RUSTSEC-2026-0173 - `proc-macro-error2` 2.0.1: unmaintained (warning).
    # BUILD-TIME proc-macro only (pulled via hax-lib-macros, the libcrux verification toolchain under
    # `openmls_rust_crypto`; `cargo tree -i proc-macro-error2 -e normal` prints nothing). It does not appear
    # in the shipped library artifact. Clears when the upstream toolchain drops it.
    "RUSTSEC-2026-0173",

    # RUSTSEC-2025-0134 - `rustls-pemfile` 2.2.0: unmaintained (warning, not a known vulnerability).
    # Direct dependency of `mimi-hubd` (`mimi-hubd/src/tls.rs`, `rustls_pemfile::certs`/`private_key`) plus
    # a transitive pull via `axum-server`. Verified usage: it parses the mTLS server certificate and
    # private key from local, operator-supplied PEM files at startup, never attacker-controlled network
    # input. No upstream fork with an equivalent API exists yet; re-evaluate if a real vulnerability
    # (not just a maintenance-status warning) is filed against this version.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0330 / RUSTSEC-2026-0331 - `libcrux-kem` 0.0.9: panics on a short hybrid seed or key
    # (fix >=0.0.10).
    # NON-ACTIVATED LOCKFILE PHANTOM. It resolves into Cargo.lock only through `hpke-rs-libcrux` 0.7.0, the
    # optional libcrux hpke-rs backend, which is not enabled (this crate uses the RustCrypto backend,
    # `openmls_rust_crypto` -> `hpke-rs-rust-crypto`): `cargo tree -i libcrux-kem` prints nothing under default
    # / --all-features / --target all, so it is never compiled or linked. `hpke-rs-libcrux` 0.7.0 pins
    # `libcrux-kem = "=0.0.9"`; the fixed version needs hpke-rs 0.8. Re-evaluate if the libcrux hpke-rs backend
    # is ever activated or `openmls_rust_crypto` moves to hpke-rs 0.8.
    "RUSTSEC-2026-0330",
    "RUSTSEC-2026-0331",

    # RUSTSEC-2026-0387 - `crypto-bigint` 0.5.5: subtraction, zero counting, division and Montgomery
    # multiplication can branch on secret values depending on compiler and CPU (fix >=0.7.6).
    # Chain: crypto-bigint <- elliptic-curve 0.13.8 <- {p256, p384, k256, ecdsa, primeorder} <-
    # {hpke-rs-rust-crypto 0.7.0, openmls_rust_crypto 0.6.0} <- mimi-core. COMPILED. No upgrade is reachable:
    # both dependents pin the elliptic-curve 0.13 family and 0.7.6 needs 0.14.
    # Disposition: ACCEPTED-RISK. The leak needs a secret integer on a NIST or secp curve. This crate generates
    # only `MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519` (Curve25519 and Ed25519, neither of which uses
    # crypto-bigint), and every KeyPackage, Welcome and GroupInfo a peer sends is refused as foreign unless it
    # names that suite. The KeyPackage gate reads the suite from its fixed wire position and refuses before it
    # decodes or verifies anything (`gate.rs`, `mimi_gate_keypackage` and `keypackage_ref`), so no NIST or secp
    # signature is verified on a peer's KeyPackage either. With the pinned suite alone, no operation on a secret
    # NIST or secp scalar runs and no P-curve arithmetic runs on a peer's bytes. Re-evaluate when
    # openmls_rust_crypto and hpke-rs move to elliptic-curve 0.14, or when this crate or a workspace member adds
    # another ciphersuite.
    "RUSTSEC-2026-0387",
]
