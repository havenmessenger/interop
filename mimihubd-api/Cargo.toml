# mimihubd-api - the client lane of mimihubd, version 1, as a library: the request and answer types, the request
# signatures of both lane profiles and of the provider, and the check of an event batch the hub pushed. A provider's
# own server links it to talk to its hub; mimihubd links it for its own side, so both ends share one implementation.
# Synchronous and runtime-free (no tokio, no HTTP stack): bring your own client and server.
[package]
name = "mimihubd-api"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "The client lane of mimihubd, v1: its types, its request signatures, and the check of a pushed event batch"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = { version = "0.10", default-features = false }
ring = "0.17"

[dev-dependencies]
serde_json = "1"
