[package]
name = "vc-vectors-xcheck"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Cross-implementation vector generator for draft-ietf-mls-virtual-clients-01 §5.2/§5.6.1-.3. Not a workspace member of mimi-core, see README.md: it depends on openmls-main (git-pinned, unreleased virtual-clients-draft feature), which the repo root's manifest-purity guard (crates.io-only) forbids for the audited library itself."

[dependencies]
mimi-core = { path = "../.." }
# openmls at the commit docs/vc-01-vector-report.md cites, the one mimi-core and mimi-hubd use, with its
# virtual-clients-draft feature.
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83", features = ["virtual-clients-draft"] }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83", features = ["virtual-clients-draft"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
