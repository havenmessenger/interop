# --- MLS checks a client in the room reports --------------------------------------------------------------------

[[reason]]
id = "leaf-lifetime"
surfaces_as = "reported by a client in the room"
spec = "RFC 9420"
section = "7.3"
quote = "If instead the LeafNode appears in a message being received by the client, e.g., a Proposal, a Commit, or a ratchet tree of the group the client is joining, it is RECOMMENDED that the client verifies that the current time is within the range of the lifetime field."
divergence = ""
reason = "A leaf in a received Proposal, Commit or joining tree is outside its lifetime; RFC 9420 recommends this check on receipt and requires it only for what a client sends."
