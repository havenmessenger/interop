# mimihubd - a runnable MIMI hub daemon: mTLS-terminated HTTP server, SQLite-backed durable state,
# 14 endpoints implementing the v1 (JSON) request-handling semantics over `mimi-core`'s gate/consent/
# room-policy logic. See README.md for the quickstart and the current wire-format status.
[package]
name = "mimihubd"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
description = "Reference MIMI hub daemon: mTLS HTTP server + durable state over mimi-core"
license = "Apache-2.0"
# This crate ships a library target (src/lib.rs) alongside its binary because the binary itself
# needs to import it - not because it's meant to be depended on as a library by anything outside
# this workspace. Never publish it to crates.io as one.
publish = false

[[bin]]
name = "mimihubd"
path = "src/main.rs"

[dependencies]
mimi-core = { path = ".." }
mimihubd-api = { path = "../mimihubd-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = { version = "0.10", default-features = false }   # /notify body hashing (dedup), Content-Digest
ring = "0.17"                                           # Ed25519 verification of DNS-key request signatures
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# mTLS: the rustls ServerConfig is built explicitly with a client-cert verifier from a configured CA
# (peer-trust allowlist) and the ring provider. axum-server's `tls-rustls` feature force-enables
# aws-lc-rs, which needs cmake; `tls-rustls-no-provider` avoids that and the provider is supplied
# via builder_with_provider instead.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }  # the TLS stream type the peer-identity acceptor names
tower = "0.5"                                           # Layer, to attach the peer certificate to a connection
# The outbound client (`outbound.rs`): an HTTP/1.1 client connection over our own TCP connect and TLS, so the address
# check sits at the connect and nothing else in the stack resolves a name. System roots for a peer's server certificate.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls-native-certs = "0.8"
httpdate = "1"                                          # Retry-After as an HTTP-date
# Durable state - one store, no in-memory residue. bundled = sqlite compiled from source, so the
# binary is container-portable with no system sqlite dependency.
rusqlite = { version = "0.41", features = ["bundled"] }
# Each room's public group state (the ratchet tree and GroupContext a delivery service keeps, no secrets). The hub reads
# participant-list and room-policy changes as AppDataUpdates, which openmls applies only with `extensions-draft`.
openmls = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83", features = ["extensions-draft"] }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83", features = ["extensions-draft"] }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83" }
# OTLP export (feature `otlp`, off by default): traces and metrics over OTLP/HTTP with protobuf bodies, sent with
# hyper and the ring rustls provider this crate already uses.
opentelemetry = { version = "=0.33.1", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "=0.33.1", optional = true, default-features = false, features = ["http-proto", "trace", "metrics"] }
opentelemetry-http = { version = "=0.33.1", optional = true, default-features = false, features = ["hyper"] }
hyper-rustls = { version = "=0.27.10", optional = true, default-features = false, features = ["http1", "tls12", "ring"] }
async-trait = { version = "0.1", optional = true }

[features]
default = []
# Export traces and metrics over OTLP when MIMI_OTLP_ENDPOINT is set. The release binary is built with it.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:hyper-rustls", "dep:async-trait"]

[dev-dependencies]
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14"
tower = { version = "0.5", features = ["util"] }        # ServiceExt::oneshot for router tests
rcgen = "0.14"                                          # test cert generation (CA + server + client)
tls_codec = "0.5"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"

# `cargo deb` packaging - a .deb for GitHub Releases, installing this daemon like a system service
# (sshd/postfix-shaped), not just a `cargo run` artifact. `debian/` holds the maintainer scripts
# (system-user creation on install; purge-only data removal), the systemd unit, and the config
# templates. `depends` layers `adduser` onto cargo-deb's own "$auto" default (detected from the
# built binary's actual dynamic links) - postinst calls `adduser` directly to create the daemon's
# system account, but a minimal Debian install has no guarantee that package is present, and $auto
# only covers the BINARY's own linked libraries, never a maintainer SCRIPT's own tool dependency.
# Without this, postinst dies under `set -e` on a bare install, leaving the package half-configured.
[package.metadata.deb]
depends = ["$auto", "adduser"]
# Replaces the mimi-hubd package, the same daemon: installing this one removes it, which keeps its configuration and
# state (only a purge deletes them).
conflicts = "mimi-hubd"
replaces = "mimi-hubd"
maintainer = "Haven Messenger <security@havenmessenger.com>"
copyright = "2026, Haven Messenger"
license-file = ["../LICENSE", "0"]
extended-description = """\
Reference MIMI hub daemon: an mTLS-terminated HTTP server with SQLite-backed durable state, \
implementing the v1 (JSON) and protocol-07 (TLS presentation-language) wire lanes over \
mimi-core's gate, consent, and room-policy logic. See DIVERGENCES.md in the source repository \
for the exact conformance boundary.\
"""
section = "net"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/mimihubd", "usr/bin/", "755"],
    ["debian/mimihubd.toml.example", "etc/mimihubd/mimihubd.toml.example", "644"],
    ["debian/mimihubd.env.example", "etc/mimihubd/mimihubd.env.example", "644"],
    ["README.md", "usr/share/doc/mimihubd/README.md", "644"],
]

# Fail-closed by design (no cert material means no serve) - a fresh install cannot possibly have
# real mTLS material yet, so auto-starting would just log a startup failure. Leave the unit
# installed-but-inactive; the admin fills in /etc/mimihubd/*.pem + the config template, then runs
# `systemctl enable --now mimihubd` themselves. `unit-scripts` defaults to `maintainer-scripts`
# above, where `mimihubd.service` already lives - no separate systemd/ directory needed.
[package.metadata.deb.systemd-units]
enable = false
start = false
